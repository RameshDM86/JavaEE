<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Applications for approval · CATS</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<header th:replace="~{fragments/header :: bar}"></header>
	<main class="page wide">
		<section class="card">
			<h1>Course applications for approval</h1>
			<p class="muted" th:if="${groups.empty}">No applications are waiting for a decision.</p>
		</section>
		<section class="card" th:each="group : ${groups}">
			<h2 th:text="${group.employeeName}">Employee</h2>
			<table>
				<thead>
					<tr>
						<th>Course</th>
						<th>Category</th>
						<th>Period</th>
						<th>Fee</th>
						<th>Status</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="course : ${group.applications}">
						<td><a th:href="@{/manager/courses/{id}(id=${course.id})}" th:text="${course.title}">Title</a></td>
						<td th:text="${course.category.label}">Category</td>
						<td th:text="${course.startDate} + ' to ' + ${course.endDate}">Dates</td>
						<td th:text="'$' + ${course.fee}">Fee</td>
						<td th:text="${course.status.label}">Status</td>
					</tr>
				</tbody>
			</table>
		</section>
	</main>
</body>
</html>
